[package]
name = "heiwa-desktop"
version = "0.3.0"
description = "Heiwa native desktop shell"
authors = ["Heiwa Limited"]
license = "Apache-2.0"
edition = "2021"
repository = "https://github.com/Heiwa-Limited/heiwa-universe"

[lib]
name = "heiwa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
futures-util = "0.3"
chrono = "0.4"
heiwa-core = { path = "../../../heiwa_core" }
heiwa_config = { path = "../../../../crates/heiwa_config" }
heiwa_identity = { path = "../../../../crates/heiwa_identity" }
heiwa-provider = { path = "../../../../crates/heiwa_provider" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tauri = { version = "2.8.5", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.10.1"
