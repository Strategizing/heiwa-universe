[package]
name = "heiwa-shell"
version = "0.2.0"
edition = "2021"
description = "Installed heiwa CLI surface for the Heiwa local-first AI runtime"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
lance = ["heiwa-session/lance"]

[[bin]]
name = "heiwa"
path = "src/main.rs"

[lib]
name = "heiwa_shell"
path = "src/lib.rs"

[dependencies]
heiwa_config = { path = "../../crates/heiwa_config" }
heiwa_identity = { path = "../../crates/heiwa_identity" }
heiwa_mesh = { path = "../../crates/heiwa_mesh" }
heiwa_work = { path = "../../crates/heiwa_work" }
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
heiwa-core = { path = "../../apps/heiwa_core" }
heiwa-session = { path = "../../crates/heiwa_session" }
heiwa-repl = { path = "../../crates/heiwa_repl" }
heiwa-provider = { path = "../../crates/heiwa_provider" }
heiwa_quota = { path = "../../crates/heiwa_quota" }
heiwa-resource = { path = "../../crates/heiwa_resource" }
heiwa_receipts = { path = "../../crates/heiwa_receipts" }
heiwa-install = { path = "../../crates/heiwa_install" }
heiwa_evidence = { path = "../../crates/heiwa_evidence" }
heiwa-loop = { path = "../../crates/heiwa_loop" }
heiwa-protocol = { path = "../../crates/heiwa_protocol" }
heiwa_mcp = { path = "../../crates/heiwa_mcp" }
heiwa-tui = { path = "../../crates/heiwa_tui" }
heiwa_drex = { path = "../../crates/heiwa_drex" }
heiwa_automations = { path = "../../crates/heiwa_automations" }
heiwa_oauth = { path = "../../crates/heiwa_oauth" }
heiwa_vault = { path = "../../crates/heiwa_vault" }
uuid = { version = "1.0", features = ["v4"] }
hostname = "0.4"
libc = "0.2"
tokio = { version = "1.50.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha1 = "0.10"
sha2 = "0.10"
tiktoken-rs = "0.6"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
