site_name: Heiwa
site_description: Local-first AI runtime documentation for Heiwa
site_url: https://docs.heiwa.ltd/
repo_url: https://github.com/Heiwa-Limited/heiwa-universe
repo_name: Heiwa-Limited/heiwa-universe

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: slate
      primary: black
      accent: teal
  font:
    text: Space Grotesk
    code: IBM Plex Mono

extra_css:
  - stylesheets/extra.css

exclude_docs: |
  audit/**
  design/**
  enterprise/**
  railway-self-operation.md
  superpowers/**

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

validation:
  nav:
    omitted_files: ignore
  links:
    not_found: ignore

nav:
  - Home: index.md
  - Current Capability: current-capability.md
  - Product Contract: product-contract.md
  - Capability Fabric: capability-fabric.md
  - Architecture: architecture.md
  - App Foundation: architecture/app-foundation.md
  - Receipts: architecture/receipts.md
  - Provider Registry: provider-registry.md
  - Routing Policy: routing.md
  - Local Operation: local-self-operation.md
  - Plugins: plugins.md
  - Deployment: deployment.md
  - Delivery Pipeline: delivery-pipeline.md
  - Security: security.md
  - Failure Modes: failure-modes.md
  - Operator Runbook: operator-runbook.md
  - Publishing Pipeline: publishing.md
  - References:
      - Upstream References: references/UPSTREAM_REFERENCES.md
