name: Desktop Build

# Builds the installable app on demand, without cutting a release.
#
# The release workflow's bundle job sits behind the release-metadata gates, so
# there was no way to answer "does the app that main produces actually
# install?" without tagging. This does exactly that and nothing else: build
# the runtime, stage it into the bundle, build the bundle, upload it.
#
# Standard GitHub-hosted runners preserve the native bundle platforms.
# scripts/check_ci_job_deadlines.rb checks runner selection here too; the
# existing 60-minute bundle deadline is separate from the CI feedback lanes.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which bundles to build"
        required: false
        default: "all"
        type: choice
        options: [all, macos, windows, linux]

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Bundle (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            runner: macos-26
            selector: macos
            bundles: app,dmg
            artifact_path: |
              target/release/bundle/dmg/*.dmg
              target/release/bundle/macos/*.app
          - name: windows-x86_64
            runner: windows-latest
            selector: windows
            bundles: msi
            artifact_path: target/release/bundle/msi/*.msi
          - name: linux-x86_64
            runner: ubuntu-latest
            selector: linux
            bundles: appimage,deb
            artifact_path: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Skip platforms not selected
        id: gate
        # The dispatch input goes through the environment rather than being
        # interpolated into the script, so the shell never parses it.
        env:
          REQUESTED: ${{ inputs.platforms }}
          SELECTOR: ${{ matrix.selector }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${REQUESTED:-all}" == "all" || "${REQUESTED:-all}" == "$SELECTOR" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.gate.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0

      - name: Rust cache
        if: steps.gate.outputs.run == 'true'
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1

      - name: Set up Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v5.0.0
        with:
          node-version: 22

      - name: Install Linux system dependencies
        if: steps.gate.outputs.run == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libdbus-1-dev pkg-config

      - name: Install frontend dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci --ignore-scripts --prefix apps/heiwa_app/desktop

      - name: Build the runtime the app ships with
        if: steps.gate.outputs.run == 'true'
        run: cargo build --release -p heiwa-shell --bin heiwa --locked

      - name: Stage the runtime as a bundled resource
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The installed app must run the runtime it shipped with, never
          # whatever `heiwa` happens to be on the user's PATH — or nothing.
          mkdir -p apps/heiwa_app/desktop/src-tauri/resources
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/heiwa.exe apps/heiwa_app/desktop/src-tauri/resources/
          else
            cp target/release/heiwa apps/heiwa_app/desktop/src-tauri/resources/
          fi

      - name: Build bundle
        if: steps.gate.outputs.run == 'true'
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: npm --prefix apps/heiwa_app/desktop run tauri:build -- --bundles "$BUNDLES"

      - name: Verify the bundle carries its runtime
        if: steps.gate.outputs.run == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # A bundle without the runtime installs an app that cannot start
          # one. Catch that here rather than on a user's machine.
          # The bundler keeps a resource's relative path, so the staged
          # `resources/heiwa` lands in a `resources/` subdirectory; a flat
          # staging is accepted too. Both are locations the supervisor
          # searches, so either one is a bundle that can start its runtime.
          app=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          test -n "$app" || { echo "no .app produced" >&2; exit 1; }
          runtime=""
          for candidate in \
            "$app/Contents/Resources/resources/heiwa" \
            "$app/Contents/Resources/heiwa"; do
            if [ -x "$candidate" ]; then runtime="$candidate"; break; fi
          done
          test -n "$runtime" \
            || { echo "bundle is missing its runtime under Contents/Resources" >&2; exit 1; }
          "$runtime" --version 2>&1 | head -1

      - name: Verify the Linux package carries its runtime
        if: steps.gate.outputs.run == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # A deb installs resources under usr/lib/<product>, not beside the
          # executable. Confirm the runtime is actually in the package rather
          # than trusting that staging it was enough.
          # Pinned to that directory rather than to any path ending in
          # `heiwa`: a runtime somewhere the app never looks is the failure
          # this step exists to catch.
          deb=$(find target/release/bundle/deb -name '*.deb' | head -1)
          test -n "$deb" || { echo "no .deb produced" >&2; exit 1; }
          if ! dpkg-deb -c "$deb" | grep -qE ' \./usr/lib/[^/]+/(resources/)?heiwa$'; then
            echo "package is missing its runtime under usr/lib/<product>" >&2
            dpkg-deb -c "$deb" >&2
            exit 1
          fi

      - name: Upload bundle
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heiwa-desktop-${{ matrix.name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
