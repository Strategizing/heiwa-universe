name: Heiwa Deploy

# Deliberate web deploys only: manual dispatch publishes the public shell.
# No push:main trigger — merging to main must not implicitly republish the
# public shell; releases are explicitly dispatched against an annotated tag.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heiwa-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Deploy Surfaces
    runs-on: ubuntu-latest
    outputs:
      deploy_core: ${{ steps.detect.outputs.deploy_core }}
      deploy_trading: ${{ steps.detect.outputs.deploy_trading }}
      deploy_web: ${{ steps.detect.outputs.deploy_web }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            {
              echo "deploy_core=false"
              echo "deploy_trading=false"
              echo "deploy_web=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="${{ github.event.before }}"
          head_sha="${{ github.sha }}"
          if [[ "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            base_sha="$(git rev-list --max-count=1 HEAD^ 2>/dev/null || git rev-list --max-count=1 HEAD)"
          fi

          scripts/detect_changed_surfaces.sh "$base_sha" "$head_sha" >> "$GITHUB_OUTPUT"

  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Fail on tracked cargo cache artifacts
        run: |
          python - <<'PY'
          import subprocess

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          bad = [path for path in tracked if "D:\\cache\\cargo" in path]
          if bad:
              raise SystemExit("Tracked cargo cache artifacts detected:\n" + "\n".join(bad[:20]))
          print("Repo hygiene check passed.")
          PY
      - name: Verify heiwa-core Dockerfile Rust floor
        run: bash scripts/check_heiwa_core_dockerfile.sh
      - name: Verify runtime baseline pins
        run: bash scripts/check_runtime_baseline.sh
      - name: Verify release metadata
        run: bash scripts/check_release_metadata.sh

  core-release-preflight:
    name: Core Rust Release Preflight
    runs-on: ubuntu-latest
    needs:
      - changes
      - repo-hygiene
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Skip core release preflight
        if: needs.changes.outputs.deploy_core != 'true'
        run: echo "No Rust runtime release changes detected."
      - name: Install Rust toolchain
        if: needs.changes.outputs.deploy_core == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - name: Rust Cache
        if: needs.changes.outputs.deploy_core == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
          prefix-key: v1-rust
          cache-bin: false
      - name: Install Linux Tauri system dependencies
        if: needs.changes.outputs.deploy_core == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config
      # heiwa-shell defaults to the `lance` feature -> lance-encoding ->
      # prost-build, which requires `protoc` on PATH.
      - name: Install protoc
        if: needs.changes.outputs.deploy_core == 'true'
        uses: taiki-e/install-action@f6886ea0c81d86f9719fdab9de74e4d72e8486fb # protoc
      - name: Run Rust release preflight
        if: needs.changes.outputs.deploy_core == 'true'
        run: cargo test --workspace --locked

  web-release-preflight:
    name: Web Release Preflight
    runs-on: ubuntu-latest
    needs:
      - changes
      - repo-hygiene
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Skip web release preflight
        if: needs.changes.outputs.deploy_web != 'true'
        run: echo "No hosted web changes detected."
      - name: Set up Node
        if: needs.changes.outputs.deploy_web == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install npm workspace dependencies
        if: needs.changes.outputs.deploy_web == 'true'
        run: npm ci --ignore-scripts
      - name: Run root typecheck
        if: needs.changes.outputs.deploy_web == 'true'
        run: npm run typecheck
      - name: Set up Python
        if: needs.changes.outputs.deploy_web == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Validate static public shell
        if: needs.changes.outputs.deploy_web == 'true'
        run: |
          python apps/heiwa_app/scripts/check_static_surface.py
          bash scripts/check_public_web_package.sh

  deploy-web:
    name: Deploy Cloudflare Public Shell
    runs-on: ubuntu-latest
    needs:
      - changes
      - web-release-preflight
      - repo-hygiene
    if: needs.changes.outputs.deploy_web == 'true'
    env:
      ENABLE_CLOUDFLARE_DEPLOY: ${{ vars.ENABLE_CLOUDFLARE_DEPLOY }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Skip Cloudflare deploy (disabled)
        if: env.ENABLE_CLOUDFLARE_DEPLOY != 'true'
        run: echo "Cloudflare deploy disabled; set ENABLE_CLOUDFLARE_DEPLOY=true after public publish credentials are verified."
      - name: Require Cloudflare credentials
        if: env.ENABLE_CLOUDFLARE_DEPLOY == 'true' && (env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == '')
        run: |
          echo "ENABLE_CLOUDFLARE_DEPLOY=true but Cloudflare credentials are missing." >&2
          exit 1
      # wrangler-action runs whatever node the runner image ships, which is
      # currently v20 while wrangler requires >=22. Every other job that
      # touches node pins it from .nvmrc; this one never did, so the deploy
      # broke the moment the runner image drifted rather than when anything
      # in this repository changed.
      - name: Set up Node
        if: env.ENABLE_CLOUDFLARE_DEPLOY == 'true' && env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Package public-only web artifact
        if: env.ENABLE_CLOUDFLARE_DEPLOY == 'true' && env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        run: bash scripts/package_public_web.sh .artifacts/public-web
      - name: Deploy to Cloudflare Pages
        if: env.ENABLE_CLOUDFLARE_DEPLOY == 'true' && env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.122.0
          command: pages deploy .artifacts/public-web --project-name=heiwa-clients --branch=main
      # Straight after a deploy the edge may still be serving the previous
      # copy, so this needs a real propagation window rather than the default
      # blip-sized one. 10 x 15s = 2.5 minutes before it calls a deploy stale.
      - name: Verify non-browser installer access
        if: env.ENABLE_CLOUDFLARE_DEPLOY == 'true' && env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        env:
          HEIWA_PUBLIC_INSTALLER_ATTEMPTS: "10"
          HEIWA_PUBLIC_INSTALLER_RETRY_DELAY: "15"
        run: bash scripts/check_public_installer_edge.sh
