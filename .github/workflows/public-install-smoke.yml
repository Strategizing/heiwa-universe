name: Public Installer Smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable Heiwa release version to install
        required: true
        default: 0.1.0
        type: string
  # Called by release.yml immediately after the release publishes, so a release
  # proves it is installable instead of waiting for someone to remember to
  # dispatch this. Both v0.1.0 and v0.2.0 shipped broken install paths that this
  # workflow would have caught at publish time.
  workflow_call:
    inputs:
      version:
        description: Stable Heiwa release version to install
        required: true
        type: string

permissions:
  contents: read

jobs:
  install:
    name: Public install (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
          - name: macos-aarch64
            runner: macos-26
    steps:
      - name: Install from the public edge
        shell: bash
        env:
          HEIWA_VERSION: ${{ inputs.version }}
          INSTALL_URL: https://heiwa.ltd/install
          RUNTIME_ROOT: ${{ runner.temp }}/heiwa-public-install
        run: |
          set -euo pipefail

          if [[ ! "$HEIWA_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must look like 0.1.0" >&2
            exit 1
          fi

          installer="${RUNNER_TEMP}/heiwa-install.sh"
          headers="${RUNNER_TEMP}/heiwa-install.headers"
          status="$({
            curl --proto '=https' --tlsv1.2 --location --silent --show-error \
              --retry 2 --retry-all-errors --retry-delay 1 \
              --user-agent 'Heiwa-Installer/0.1 (+https://heiwa.ltd)' \
              --header 'Accept: text/x-shellscript' \
              --dump-header "$headers" \
              --output "$installer" \
              --write-out '%{http_code}' \
              "$INSTALL_URL"
          } || true)"
          if [[ "$status" != "200" ]]; then
            echo "public installer returned HTTP $status" >&2
            sed -n '1,80p' "$headers" >&2 || true
            sed -n '1,80p' "$installer" >&2 || true
            exit 1
          fi
          test -s "$installer"

          HEIWA_HOME="$RUNTIME_ROOT" sh "$installer" | tee "$RUNTIME_ROOT/install.log"
          test -x "$RUNTIME_ROOT/bin/heiwa"
          test -f "$RUNTIME_ROOT/app/cockpit-current/index.html"
          "$RUNTIME_ROOT/bin/heiwa" --version | grep -Fx "heiwa $HEIWA_VERSION"

          # v0.2.0 is the first release where `curl | sh` installs an
          # application rather than a CLI plus a web page. Asserting the
          # binary alone would keep passing if the app silently stopped
          # shipping.
          # Assert on the path the installer reports rather than a guessed
          # one: it prefers /Applications and falls back to ~/Applications
          # only when that is not writable, and which branch a runner takes
          # is not this test's business.
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            bundle="$(sed -n 's/^  app: //p' "$RUNTIME_ROOT/install.log")"
            if [[ -z "$bundle" ]]; then
              echo "installer reported no app path; it installed a CLI, not an app" >&2
              cat "$RUNTIME_ROOT/install.log" >&2
              exit 1
            fi
            test -x "$bundle/Contents/MacOS/Heiwa" || {
              echo "reported bundle $bundle has no executable" >&2
              exit 1
            }
            echo "installed app: $bundle"
          fi

          # v0.1.0 shipped four hours before its own update path landed and
          # reported "implemented": false, stranding every install. That field
          # no longer exists -- it was the stub -- so assert the fields the
          # working path emits, and that the binary agrees with the release it
          # came from. A binary that misreports its version offers itself an
          # endless update.
          update_plan="$("$RUNTIME_ROOT/bin/heiwa" app update --dry-run --json)"
          printf '%s\n' "$update_plan"
          printf '%s' "$update_plan" | grep -q '"source_mode": *"github-release"' || {
            echo "installed runtime has no GitHub release update path" >&2
            exit 1
          }
          printf '%s' "$update_plan" \
            | grep -q "\"current_version\": *\"${HEIWA_VERSION}\"" || {
            echo "runtime reports a version other than $HEIWA_VERSION" >&2
            exit 1
          }

      - name: Boot installed runtime and verify cockpit
        shell: bash
        env:
          HEIWA_HOME: ${{ runner.temp }}/heiwa-public-install
          PORT: "7475"
        run: |
          set -euo pipefail

          "$HEIWA_HOME/bin/heiwa" app start --port "$PORT" --no-open >"${RUNNER_TEMP}/heiwa-app.log" 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT HUP INT TERM

          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:${PORT}/api/v1/runtime/snapshot" \
              | grep -q '"status":"ok"'; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            cat "${RUNNER_TEMP}/heiwa-app.log" >&2
            exit 1
          fi

          curl --fail --silent --show-error "http://127.0.0.1:${PORT}/" \
            | grep -qi '<!doctype html>'
          grep -F "static: $HEIWA_HOME/app/cockpit-current" "${RUNNER_TEMP}/heiwa-app.log"
