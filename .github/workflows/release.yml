name: Heiwa Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to release (for example v0.1.0)
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: heiwa-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 16
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      # Releases are dispatched from main so optimized Rust caches live on the
      # default branch and remain reusable by later release tags.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - id: meta
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          tag="${DISPATCH_TAG}"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must look like v0.1.0" >&2
            exit 1
          fi

          if [[ "$(git cat-file -t "$tag" 2>/dev/null || true)" != "tag" ]]; then
            echo "Release tag must exist and be annotated: $tag" >&2
            exit 1
          fi

          commit="$(git rev-parse "${tag}^{}")"
          if ! git merge-base --is-ancestor "$commit" HEAD; then
            echo "Release tag $tag does not resolve to a commit on main" >&2
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

      # Validate the resolved tag's data with trusted validators from main.
      # Checking main's current declarations can approve an old mismatched
      # tag, or reject a valid ancestor once main advances to the next version.
      # Restore only data files; never execute validation scripts from the tag.
      - name: Stage release version and installer declarations
        id: release-source
        shell: bash
        env:
          RELEASE_COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          set -euo pipefail
          git restore --source="$RELEASE_COMMIT" --worktree -- \
            apps/heiwa_shell/Cargo.toml \
            apps/heiwa_core/Cargo.toml \
            apps/heiwa_app/desktop/src-tauri/Cargo.toml \
            apps/heiwa_app/desktop/src-tauri/tauri.conf.json \
            apps/heiwa_app/desktop/package.json \
            apps/heiwa_app/clients/web/install \
            apps/heiwa_app/clients/web/install.sh

      # Every other gate compares the tag against the installer pin. None
      # compared it against the code, which is how v0.2.0 shipped a binary
      # reporting `heiwa 0.1.0`.
      - name: Require the code to declare the version being released
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: bash scripts/check_release_version_sync.sh "$RELEASE_VERSION"

      - name: Require a fresh public installer pin
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: bash scripts/check_installer_version_pin.sh "$RELEASE_VERSION"

      # The checkout pin and the bytes served at heiwa.ltd/install are different
      # truths: the installer reaches users through the dispatch-only Cloudflare
      # deploy, which this workflow does not trigger. Without this check a
      # release can go out while the edge still serves the previous fallback,
      # and any new install whose latest-release lookup fails lands on the old
      # version. Deploy the installer first, then release.
      - name: Require the served public installer to match
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: bash scripts/check_installer_version_pin.sh --served "$RELEASE_VERSION"

      - name: Require successful full main certification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 900))
          required_workflows=(ci.yml certification.yml)
          while (( SECONDS < deadline )); do
            all_passed=true
            for workflow_file in "${required_workflows[@]}"; do
              result="$({
                gh api \
                  "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?event=push&branch=main&head_sha=${RELEASE_COMMIT}&per_page=20" \
                  --jq '.workflow_runs | sort_by(.run_number) | last | [.status, (.conclusion // "")] | @tsv'
              } 2>/dev/null || true)"

              if [[ -z "$result" ]]; then
                echo "Waiting for ${workflow_file} to start at ${RELEASE_COMMIT}."
                all_passed=false
                continue
              fi

              IFS=$'\t' read -r status conclusion <<<"$result"
              if [[ "$status" != "completed" ]]; then
                echo "Waiting for ${workflow_file} at ${RELEASE_COMMIT}: ${status}."
                all_passed=false
                continue
              fi

              if [[ "$conclusion" != "success" ]]; then
                echo "${workflow_file} failed at ${RELEASE_COMMIT}: ${conclusion}." >&2
                exit 1
              fi
            done

            if [[ "$all_passed" == "true" ]]; then
              echo "Fast CI and full certification passed at ${RELEASE_COMMIT}."
              exit 0
            fi
            sleep 10
          done

          echo "Timed out waiting for main certification at ${RELEASE_COMMIT}." >&2
          exit 1

  cockpit:
    name: Build Cockpit Assets
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ needs.metadata.outputs.commit }}
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build cockpit
        run: |
          npm ci --ignore-scripts
          npm --prefix apps/heiwa_app/clients/cockpit run build
          test -f apps/heiwa_app/clients/cockpit/dist/index.html
          test -n "$(find apps/heiwa_app/clients/cockpit/dist/assets -type f -print -quit)"
      - name: Upload cockpit assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cockpit
          path: apps/heiwa_app/clients/cockpit/dist/
          if-no-files-found: error

  # macOS only, deliberately. latest.json describes darwin-aarch64 and nothing
  # else, and the public installer places the app on macOS alone -- a Windows
  # or Linux bundle here would be an artifact no install path consumes and no
  # updater manifest covers. They return when those two things exist for them.
  # The CLI tarball in `build` below still ships for all three platforms.
  desktop-bundle:
    name: Build Desktop Bundle (${{ matrix.name }})
    needs: [metadata]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            runner: macos-26
            # No .dmg. It builds fine and is the one macOS format we cannot
            # ship: a browser download sets com.apple.quarantine and Gatekeeper
            # blocks an unsigned app, so publishing it would put a broken
            # artifact behind the most obvious download button on the releases
            # page. curl and the updater set no quarantine bit; both consume
            # the tarball below.
            bundles: app
            artifact_glob: |
              dist/desktop/*-app.tar.gz
              dist/desktop/*-app.tar.gz.sig
              dist/desktop/latest.json

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ needs.metadata.outputs.commit }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1

      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v5.0.0
        with:
          node-version: 22

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libdbus-1-dev pkg-config

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --prefix apps/heiwa_app/desktop

      - name: Build the runtime the app ships with
        # The bundle carries its own runtime. Without this the installed app
        # would fall back to whatever `heiwa` happens to be on the user's
        # PATH, or to none at all.
        run: cargo build --release -p heiwa-shell --bin heiwa --locked

      - name: Stage the runtime as a bundled resource
        shell: bash
        run: |
          mkdir -p apps/heiwa_app/desktop/src-tauri/resources
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/heiwa.exe apps/heiwa_app/desktop/src-tauri/resources/
          else
            cp target/release/heiwa apps/heiwa_app/desktop/src-tauri/resources/
          fi

      - name: Build desktop bundle
        env:
          # createUpdaterArtifacts is on, so the bundler signs the update
          # payload during this step. Without the key the build fails here
          # rather than publishing a release nobody can update to.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm --prefix apps/heiwa_app/desktop run tauri:build -- --bundles ${{ matrix.bundles }}

      # A browser download sets com.apple.quarantine and Gatekeeper blocks
      # the app; curl and the updater do not. So the shipped macOS artifact is
      # the bundler's own signed tarball, fetched by the installer, rather
      # than the .dmg. One artifact serves the installer and the updater.
      - name: Collect the signed macOS app and write the update manifest
        if: matrix.name == 'macos-aarch64'
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          bundle_dir="target/release/bundle/macos"
          archive="${bundle_dir}/Heiwa.app.tar.gz"
          signature="${archive}.sig"

          for required in "$archive" "$signature"; do
            test -f "$required" || {
              echo "missing $required -- createUpdaterArtifacts did not run," \
                "or TAURI_SIGNING_PRIVATE_KEY was not set" >&2
              exit 1
            }
          done

          mkdir -p dist/desktop
          asset="heiwa-${VERSION}-macos-aarch64-app.tar.gz"
          cp "$archive" "dist/desktop/${asset}"
          cp "$signature" "dist/desktop/${asset}.sig"

          # The manifest points at the renamed asset, so the URL has to be
          # built from the release tag rather than copied from the bundler.
          base="https://github.com/Heiwa-Limited/heiwa-universe/releases/download/v${VERSION}"
          python3 -c '
          import json, sys
          version, url, sig_path = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(sig_path) as handle:
              signature = handle.read().strip()
          print(json.dumps({
              "version": version,
              "notes": "Heiwa " + version,
              "platforms": {"darwin-aarch64": {"signature": signature, "url": url}},
          }, indent=2))
          ' "$VERSION" "$base/${asset}" "dist/desktop/${asset}.sig" \
            > dist/desktop/latest.json

          python3 -c "import json,sys; d=json.load(open('dist/desktop/latest.json')); assert d['platforms']['darwin-aarch64']['signature'], 'empty signature'; print('manifest ok:', d['version'])"

      - name: Upload desktop bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  build:
    name: Build Release Asset (${{ matrix.name }})
    needs: [metadata, cockpit]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            binary_name: heiwa
          - name: macos-aarch64
            # macos-14 is retiring; macos-26 GA since 2026-02-26. Keep the
            # bundle minimumSystemVersion floor at 14.0 — runner != floor.
            runner: macos-26
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            binary_name: heiwa
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            binary_name: heiwa.exe
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ needs.metadata.outputs.commit }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          target: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
          prefix-key: v3-release
          shared-key: ${{ matrix.target }}
          cache-on-failure: true
          cache-workspace-crates: true
          cache-bin: false

      # Release binaries explicitly include Lance; its lance-encoding
      # dependency shells out to `protoc` at build time.
      - name: Install protoc
        uses: taiki-e/install-action@f6886ea0c81d86f9719fdab9de74e4d72e8486fb # protoc

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Build release binary
        run: >
          cargo build --locked --release -p heiwa-shell --bin heiwa
          --features heiwa-shell/lance --target ${{ matrix.target }}

      - name: Download cockpit assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cockpit
          path: cockpit-dist

      - name: Package archive
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          ASSET_NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          BINARY_NAME: ${{ matrix.binary_name }}
        run: |
          set -euo pipefail

          release_root="dist/heiwa-${VERSION}-${ASSET_NAME}"
          archive_path="${release_root}.${ARCHIVE_EXT}"
          binary_path="target/${TARGET}/release/${BINARY_NAME}"

          mkdir -p "${release_root}/cockpit"
          cp "${binary_path}" "${release_root}/"
          cp README.md CONTRIBUTING.md CODE_OF_CONDUCT.md LICENSE "${release_root}/"
          cp -R cockpit-dist/. "${release_root}/cockpit/"
          test -f "${release_root}/cockpit/index.html"
          test -n "$(find "${release_root}/cockpit/assets" -type f -print -quit)"

          if [[ "${ARCHIVE_EXT}" == "zip" ]]; then
            # Run 7z from dist so the archive starts at the declared release
            # root instead of accidentally embedding an extra dist/ parent.
            (
              cd dist
              7z a "$(basename "${archive_path}")" "$(basename "${release_root}")" >/dev/null
            )
          else
            tar -C dist -czf "${archive_path}" "heiwa-${VERSION}-${ASSET_NAME}"
          fi

      - name: Upload packaged asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: dist/heiwa-${{ needs.metadata.outputs.version }}-${{ matrix.name }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  checksums:
    name: Generate Checksums
    needs: [metadata, build, desktop-bundle]
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-*"
          path: dist
          merge-multiple: true

      - name: Write checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum heiwa-* > "heiwa-${{ needs.metadata.outputs.version }}-checksums.txt"
          # A silently-absent app archive would ship a release whose installer
          # has nothing to place in /Applications.
          grep -q -- '-macos-aarch64-app\.tar\.gz$' \
            "heiwa-${{ needs.metadata.outputs.version }}-checksums.txt" || {
            echo "checksum manifest is missing the macOS app archive" >&2
            exit 1
          }

      - name: Upload checksum artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: dist/heiwa-${{ needs.metadata.outputs.version }}-checksums.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [metadata, build, checksums, desktop-bundle]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-*"
          path: release-artifacts
          merge-multiple: true

      - name: Download checksum manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums
          path: release-artifacts

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-artifacts/*

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: Heiwa ${{ needs.metadata.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-artifacts/*

  # A release is not done when the assets exist; it is done when a stranger can
  # install it. v0.1.0 shipped an update path that reported `"implemented":
  # false` and stranded every install; v0.2.0 shipped a binary that reported
  # `heiwa 0.1.0`. The smoke workflow catches both classes, but it was
  # dispatch-only, so it only ran when someone remembered. Run it against the
  # version that was just published.
  verify-install:
    name: Verify Public Install
    needs: [metadata, publish]
    uses: ./.github/workflows/public-install-smoke.yml
    with:
      version: ${{ needs.metadata.outputs.version }}

  # Package the exact release bytes already published and checksummed. Keep
  # one container publication recipe for standalone and release-triggered runs.
  container:
    name: Build and Push Container Image
    needs: [metadata, publish]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      tag: ${{ needs.metadata.outputs.tag }}
