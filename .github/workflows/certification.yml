name: Heiwa Certification

# Expensive release proofs never block the sub-minute change gate. They run on
# every protected-main commit and must pass at the exact commit before release.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heiwa-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Multi-Ecosystem Security Certification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - name: Install cargo-audit
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-audit
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.4
      - name: Install audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install uv==0.12.1
          # The cockpit is a workspace member in the root package.json, so the
          # root install above already covers it. It gets no lockfile of its
          # own -- a workspace member with one is the orphan that e70a1fe4
          # removed -- and `npm ci --prefix` there fails with EUSAGE.
          # apps/heiwa_app/desktop is not a workspace and does need its own.
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix apps/heiwa_app/desktop
      - name: Run multi-ecosystem security certification
        run: bash scripts/verify_security.sh --skip-secret-scan

  cross-platform:
    name: Cross-Platform Rust Compilation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - name: Install on-demand compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Run Linux Rust tests
        if: runner.os == 'Linux'
        run: >
          cargo test --workspace --exclude heiwa-desktop --locked
          --no-default-features
      - name: Compile non-Linux Rust test targets
        if: runner.os != 'Linux'
        run: >
          cargo test --workspace --exclude heiwa-desktop --locked
          --no-default-features --no-run

  rust-static:
    name: Rust Static Certification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Install on-demand compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install Linux system dependencies
        run: sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Rust clippy
        run: >
          cargo clippy --workspace --exclude heiwa-desktop --locked --all-targets
          --no-default-features --
          -A clippy::too_many_arguments
          -A clippy::new_without_default
          -A clippy::unnecessary_to_owned
          -A clippy::needless_range_loop
          -A clippy::approx_constant
          -A clippy::collapsible_if
          -A clippy::bool_assert_comparison
          -A clippy::type_complexity
          -A clippy::needless_borrows_for_generic_args
          -A clippy::unnecessary_unwrap
          -D warnings
      - name: Install cargo-machete
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-machete
      - name: Check unused Rust dependencies
        run: cargo machete

  lance:
    name: Lance Backend Certification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: target/lance
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - name: Install on-demand compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install protoc
        uses: taiki-e/install-action@f6886ea0c81d86f9719fdab9de74e4d72e8486fb # protoc
      - name: Certify Lance backend
        run: |
          cargo test -p heiwa_embed --locked --features lance
          cargo test -p heiwa-session --locked --features lance --test operator_service

  desktop:
    name: Desktop Shell Certification (macOS)
    runs-on: macos-15
    timeout-minutes: 12
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - name: Install on-demand compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Check desktop shell
        run: cargo check -p heiwa-desktop --locked
