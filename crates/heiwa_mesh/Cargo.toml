[package]
name = "heiwa_mesh"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Mesh node identity, capability advertisement, and signed replication envelopes for Heiwa."

[dependencies]
heiwa_vault = { path = "../heiwa_vault" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
ed25519-dalek = "2"
tempfile = "3"
