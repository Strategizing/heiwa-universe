[project]
name = "heiwa-sidecar"
version = "0.1.0"
description = "Heiwa Python compatibility sidecar with stdio JSONL diagnostics"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Heiwa", email = "noreply@heiwa.dev" }]
license = { text = "Apache-2.0" }

dependencies = [
    "langgraph>=0.2.0",
    "pydantic>=2.9.0",
    "heiwa-sdk",
]

[project.urls]
Homepage = "https://github.com/Heiwa-Limited/heiwa-universe"
Repository = "https://github.com/Heiwa-Limited/heiwa-universe"
Documentation = "https://heiwa-limited.github.io/heiwa-universe/"
Issues = "https://github.com/Heiwa-Limited/heiwa-universe/issues"

[tool.uv.sources]
heiwa-sdk = { path = "../../packages/heiwa_sdk", editable = true }

[project.scripts]
heiwa-sidecar = "heiwa_sidecar.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heiwa_sidecar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
