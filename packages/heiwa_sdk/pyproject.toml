[project]
name = "heiwa-sdk"
version = "0.1.0"
description = "Heiwa Python SDK"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Heiwa", email = "noreply@heiwa.dev" }]
license = { text = "Apache-2.0" }
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "cryptography>=43.0.0",
    "dateparser>=1.2.0",
    "recurrent>=0.4.1",
]

[project.urls]
Homepage = "https://github.com/Heiwa-Limited/heiwa-universe"
Repository = "https://github.com/Heiwa-Limited/heiwa-universe"
Documentation = "https://docs.heiwa.ltd/"
Issues = "https://github.com/Heiwa-Limited/heiwa-universe/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heiwa_sdk"]
