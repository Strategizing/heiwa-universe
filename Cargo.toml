[workspace]
members = [
    "apps/heiwa_core",
    "apps/heiwa_orchestrator",
    "apps/heiwa_shell",
    "apps/heiwa_app/desktop/src-tauri",
    "crates/heiwa_a2a",
    "crates/heiwa_automations",
    "crates/heiwa_config",
    "crates/heiwa_drex",
    "crates/heiwa_embed",
    "crates/heiwa_evidence",
    "crates/heiwa_identity",
    "crates/heiwa_install",
    "crates/heiwa_loop",
    "crates/heiwa_memory",
    "crates/heiwa_mesh",
    "crates/heiwa_oauth",
    "crates/heiwa_mcp",
    "crates/heiwa_protocol",
    "crates/heiwa_provider",
    "crates/heiwa_quota",
    "crates/heiwa_receipts",
    "crates/heiwa_resource",
    "crates/heiwa_repl",
    "crates/heiwa_session",
    "crates/heiwa_tui",
    "crates/heiwa_vault",
]
resolver = "2"

[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/Heiwa-Limited/heiwa-universe"
homepage = "https://github.com/Heiwa-Limited/heiwa-universe"
documentation = "https://heiwa-limited.github.io/heiwa-universe/"
readme = "README.md"
keywords = ["heiwa", "ai", "agents", "cli", "local-first"]
categories = ["command-line-utilities", "development-tools"]

# Keep proc-macro and build-script crates cheap to compile; these run only at
# build time. This once masked host linker ld-27037's malformed LINKEDIT output,
# but clean Apple Silicon desktop builds now select Rust's bundled Mach-O linker
# through apps/heiwa_app/desktop/scripts/tauri-build.mjs instead.
[profile.release.build-override]
opt-level = 0
codegen-units = 16
